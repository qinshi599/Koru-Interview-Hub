services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=interviewapp;Username=postgres;Password=devpassword"
      Gemini__ApiKey: "${GEMINI_API_KEY}"
      Gemini__Model: "gemini-flash-lite-latest"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: interviewapp
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
